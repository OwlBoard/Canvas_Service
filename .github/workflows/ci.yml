# This name will appear in the "Actions" tab of your GitHub repository.
name: Go CI/CD Pipeline

# This section defines the triggers for the workflow.
# It will run on every push to any branch and on any pull request.
on:
  push:
    branches: [ "main" ] # Runs on pushes to the main branch
  pull_request:
    branches: [ "main" ] # Runs on pull requests targeting the main branch

# A workflow run is made up of one or more jobs that can run sequentially or in parallel.
jobs:
  # This job is named "lint-test-build".
  lint-test-build:
    # The type of virtual machine to run the job on. "ubuntu-latest" is a good default.
    runs-on: ubuntu-latest

    # A sequence of tasks that will be executed as part of the job.
    steps:
      # Step 1: Check out your repository code so the workflow can access it.
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Set up the Go environment.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Specify your Go version

      # Step 3: Install project dependencies.
      - name: Install dependencies
        run: go mod download

      # Step 4: Lint and vet the code for style and errors.
      - name: Lint and Vet
        run: go vet ./...

      # Step 5: Run tests.
      - name: Run tests
        run: |
          go test -v ./...
      
      # Step 6: Build the application to ensure it compiles.
      - name: Build
        run: go build -v -o canvas_service .